name: TestVeh booking platform checks
on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-tests.yml'
  push:
    branches:
      - product/testveh-booking-platform
    paths:
      - 'platform/**'
      - '.github/workflows/platform-tests.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testveh_test
          POSTGRES_USER: testveh
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testveh -d testveh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://testveh:local_ci_only@localhost:5432/testveh_test
      TEST_DATABASE_URL: postgres://testveh:local_ci_only@localhost:5432/testveh_test
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply database migrations twice to verify idempotence
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npm test
      - run: npm run build
